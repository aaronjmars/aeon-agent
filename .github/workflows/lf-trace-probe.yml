name: lf-trace-probe
# Temporary probe for the Langfuse trace-tree break (removed before merge).
on:
  push:
    branches: [fix/langfuse-trace-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - run: npm install -g @anthropic-ai/claude-code@2.1.287 && mkdir -p /tmp/cc301 && npm install --prefix /tmp/cc301 @anthropic-ai/claude-code@2.1.301
      - name: Probe
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ vars.LANGFUSE_HOST }}
        run: |
          set -uo pipefail
          claude --version
          source scripts/langfuse-otel.sh
          mkdir -p /tmp/mcpdir /tmp/emptydir
          printf '%s\n' '{"mcpServers":{"base":{"type":"http","url":"https://mcp.base.org","headers":{"Authorization":"Bearer ${MCP_BASE_TOKEN}"}}}}' > /tmp/mcpdir/.mcp.json
          run() { # variant dir extra-args claude-bin
            local v=$1 d=$2 x=$3 i
            for i in 1 2 3 4 5 6; do
              local s="probe-${GITHUB_RUN_ID}-${v}-${i}"
              ( cd "$d"
                export OTEL_RESOURCE_ATTRIBUTES="service.name=aeon,deployment.environment=fix-probe,langfuse.session.id=${s},langfuse.trace.name=probe:${v}"
                export TRACEPARENT="00-$(openssl rand -hex 16)-$(openssl rand -hex 8)-01"; echo "TP $s $TRACEPARENT"
                echo "Run the Bash command: ls -1 / | head -3 . Then reply with just: ok" | claude -p - --output-format json --model claude-haiku-5-5 --permission-mode default --allowedTools "Bash(ls:*),Bash(head:*)" --settings "$x" | jq -c '{v:"'"$v"'", s:"'"$s"'", is_error, num_turns, duration_ms}' )
            done
          }
          run S-hook1s "$GITHUB_WORKSPACE" '{"hooks":{"SessionStart":[{"hooks":[{"type":"command","command":"sleep 1"}]}]}}'
          run T-hook05s "$GITHUB_WORKSPACE" '{"hooks":{"SessionStart":[{"hooks":[{"type":"command","command":"sleep 0.5"}]}]}}'
          run U-nohook "$GITHUB_WORKSPACE" '{}'
          sleep 5
