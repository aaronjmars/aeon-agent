# Aeon configuration — aeon-agent
#
# Enable skills by setting enabled: true. Multiple skills at the same time run in parallel.
# Set var: "value" to pass a default parameter to the skill.
# Set model: "claude-sonnet-4-6" to override the default model for cost optimization.

skills:
  # --- Daily: Market & Social ---
  token-report: { enabled: true, schedule: "0 6 * * *", model: "claude-sonnet-4-6" }
  fetch-tweets: { enabled: false, schedule: "30 6 * * *", var: "$AEON OR @aeonframework OR github.com/aaronjmars/aeon", model: "claude-sonnet-4-6" }
  repo-pulse: { enabled: true, schedule: "0 10 * * *", model: "claude-sonnet-4-6" }

  # --- Daily: Rewards ---
  tweet-allocator: { enabled: false, schedule: "0 8 * * *", model: "claude-sonnet-4-6" }

  # --- Daily: Shipping & Content ---
  push-recap: { enabled: true, schedule: "0 15 * * *" }
  project-lens: { enabled: true, schedule: "0 16 * * *" }

  # --- Every 2 days: Content & Meta ---
  repo-actions: { enabled: true, schedule: "0 14 */2 * *", model: "claude-sonnet-4-6" }
  repo-article: { enabled: true, schedule: "0 16 * * *" }
  self-improve: { enabled: true, schedule: "0 13 */2 * *" }

  # --- Weekly ---
  weekly-shiplog: { enabled: true, schedule: "0 9 * * 1" }  # Monday morning
  skill-leaderboard: { enabled: false, schedule: "0 17 * * 0", model: "claude-sonnet-4-6" }  # Sunday 17:00 UTC
  hyperstitions-ideas: { enabled: false, schedule: "0 10 * * 6" }

  # --- Build (Daily) ---
  feature: { enabled: true, schedule: "0 11 * * *" }

  # === HOUSEKEEPING ===
  heartbeat: { enabled: true, schedule: "0 19 * * *", model: "claude-sonnet-4-6" }
  memory-flush: { enabled: true, schedule: "0 18 * * 0,3", model: "claude-sonnet-4-6" }  # Sun + Wed

  # === DISABLED (available on demand) ===
  morning-brief: { enabled: false, schedule: "0 7 * * *" }
  daily-routine: { enabled: false, schedule: "0 7 * * *" }
  rss-digest: { enabled: false, schedule: "0 7 * * *" }
  hacker-news-digest: { enabled: false, schedule: "0 7 * * *" }
  hn-digest: { enabled: false, schedule: "0 7 * * *" }
  paper-digest: { enabled: false, schedule: "0 7 * * *" }
  tweet-digest: { enabled: false, schedule: "0 7 * * *" }
  reddit-digest: { enabled: false, schedule: "0 7 * * *" }
  telegram-digest: { enabled: false, schedule: "30 7 * * *", model: "claude-sonnet-4-6" }
  issue-triage: { enabled: false, schedule: "0 9 * * *" }
  pr-review: { enabled: false, schedule: "0 9 * * *" }
  pr-skill-triage: { enabled: false, schedule: "workflow_dispatch", model: "claude-sonnet-4-6", var: "" } # workflow_dispatch only — structured triage receipt for inbound PRs that introduce/modify SKILL.md files on aaronjmars/aeon-agent. Runs skill-security-scan against each SKILL.md, enumerates required secrets, checks cron slot conflicts vs existing aeon.yml, surfaces quality signals (description, step count, notify call, tags). Posts ONE structured comment per (PR, head_sha). var: PR_NUMBER on aaronjmars/aeon-agent. Gated notify (BLOCK or COMMENT_FAILED only). Backport of upstream aeon PR #259.
  auto-merge: { enabled: false, schedule: "0 14 * * *" }
  auto-merge-agent-prs: { enabled: false, schedule: "0 18 * * *", model: "claude-sonnet-4-6", var: "" } # daily 18:00 UTC — close the loop on agent-authored PRs by auto-merging green, unblocked ones (author=aeonframework, all checks SUCCESS, no blocking labels). Uses gh pr merge --squash --auto (queues mid-CI merges). 5-PR-per-run cap, 3-attempt retry cap, 24h re-notify dedup on ALL_BLOCKED. Pass dry-run to preview, or owner/repo to scope.
  github-monitor: { enabled: false, schedule: "0 9 * * *" }
  github-issues: { enabled: false, schedule: "0 9 * * *" }
  github-trending: { enabled: false, schedule: "0 9 * * *" }
  github-releases: { enabled: false, schedule: "30 9 * * *" }
  token-alert: { enabled: false, schedule: "0 12 * * *" }
  token-movers: { enabled: false, schedule: "0 12 * * *" }
  trending-coins: { enabled: false, schedule: "0 12 * * *" }
  wallet-digest: { enabled: false, schedule: "0 12 * * *" }
  on-chain-monitor: { enabled: false, schedule: "0 12 * * *" }
  defi-monitor: { enabled: false, schedule: "0 12 * * *" }
  defi-overview: { enabled: false, schedule: "0 12 * * *" }
  treasury-info: { enabled: false, schedule: "0 12 * * *" }
  distribute-tokens: { enabled: false, schedule: "workflow_dispatch", var: "" }
  monitor-polymarket: { enabled: false, schedule: "30 12 * * *", model: "claude-sonnet-4-6" }
  polymarket: { enabled: false, schedule: "0 12 * * *" }
  polymarket-comments: { enabled: false, schedule: "0 13 * * *" }
  monitor-runners: { enabled: false, schedule: "0 12 * * *" }
  token-pick: { enabled: false, schedule: "0 12 * * *" }
  market-context-refresh: { enabled: false, schedule: "0 13 * * *", model: "claude-sonnet-4-6" }
  narrative-tracker: { enabled: false, schedule: "30 13 * * *" }
  unlock-monitor: { enabled: false, schedule: "0 10 * * 1" }
  article: { enabled: false, schedule: "0 14 * * *" }
  technical-explainer: { enabled: false, schedule: "30 14 * * *" }
  digest: { enabled: false, schedule: "0 14 * * *" }
  research-brief: { enabled: false, schedule: "0 14 * * *" }
  deep-research: { enabled: false, schedule: "workflow_dispatch", var: "" }
  last30: { enabled: false, schedule: "workflow_dispatch", var: "" }
  paper-pick: { enabled: false, schedule: "0 14 * * *" }
  search-papers: { enabled: false, schedule: "0 14 * * *" }
  search-skill: { enabled: false, schedule: "0 14 * * *" }
  security-digest: { enabled: false, schedule: "0 14 * * *" }
  idea-capture: { enabled: false, schedule: "0 14 * * *" }
  deal-flow: { enabled: false, schedule: "0 14 * * 1" }
  reg-monitor: { enabled: false, schedule: "0 14 * * 3" }
  code-health: { enabled: false, schedule: "0 16 * * *" }
  changelog: { enabled: false, schedule: "0 16 * * *" }
  build-skill: { enabled: false, schedule: "0 16 * * *" }
  external-feature: { enabled: false, schedule: "30 16 * * *", var: "" }
  vuln-scanner: { enabled: false, schedule: "0 16 * * 6", var: "" }
  skill-security-scan: { enabled: false, schedule: "0 16 * * 1" }
  deploy-prototype: { enabled: false, schedule: "workflow_dispatch", var: "" }
  autoresearch: { enabled: false, schedule: "workflow_dispatch", var: "" }
  create-skill: { enabled: false, schedule: "workflow_dispatch", var: "" }
  auto-workflow: { enabled: false, schedule: "workflow_dispatch", var: "" }
  refresh-x: { enabled: false, schedule: "0 17 * * *" }
  list-digest: { enabled: false, schedule: "0 17 * * *" }
  write-tweet: { enabled: false, schedule: "0 17 * * *" }
  reply-maker: { enabled: false, schedule: "0 17 * * *" }
  remix-tweets: { enabled: false, schedule: "30 17 * * *" }
  tweet-roundup: { enabled: false, schedule: "0 17 * * *", var: "" }
  agent-buzz: { enabled: false, schedule: "30 17 * * *" }
  farcaster-digest: { enabled: false, schedule: "0 17 * * *" }
  vibecoding-digest: { enabled: false, schedule: "30 17 * * *" }
  channel-recap: { enabled: false, schedule: "0 17 * * 0", var: "" }
  rss-feed: { enabled: false, schedule: "30 17 * * *" }
  thread-formatter: { enabled: true, schedule: "30 17 * * *", model: "claude-sonnet-4-6", var: "" } # daily 17:30 UTC — score today's events from memory/logs and format the top one as a 5-tweet thread ready to paste; no-op silently on quiet days (THREAD_FORMATTER_NO_SIGNAL when top score < 3). Set var to override the topic.
  update-gallery: { enabled: false, schedule: "0 18 * * 0" }
  goal-tracker: { enabled: false, schedule: "0 18 * * *" }
  skill-health: { enabled: false, schedule: "0 18 * * *" }
  skill-freshness: { enabled: false, schedule: "0 8 * * *", model: "claude-sonnet-4-6", var: "" } # daily 08:00 UTC — audit enabled skills' upstream file dependencies for staleness; pass dry-run to skip notify; per-class thresholds (articles 28h / .outputs 4h / topics 7d / state 30d); fingerprint-based dedup, 7d re-emit window
  self-review: { enabled: false, schedule: "0 18 * * *" }
  reflect: { enabled: false, schedule: "0 18 * * *" }
  action-converter: { enabled: false, schedule: "0 18 * * *" }
  startup-idea: { enabled: false, schedule: "0 18 * * *" }
  tool-builder: { enabled: false, schedule: "reactive", var: "" }
  skill-repair: { enabled: false, schedule: "reactive", var: "" }
  evening-recap: { enabled: false, schedule: "0 21 * * *", model: "claude-sonnet-4-6" }
  vercel-projects: { enabled: false, schedule: "0 18 * * 0", model: "claude-sonnet-4-6", var: "" }
  cost-report: { enabled: false, schedule: "0 7 * * 1", model: "claude-sonnet-4-6" }
  spend-monitor: { enabled: false, schedule: "0 12 * * *", model: "claude-sonnet-4-6", var: "" } # daily 12:00 UTC — API spend watchdog: running weekly cost vs WEEKLY_BUDGET_CAP (default $200), OK/WATCH/WARN/ALERT tiers, silent under 50%. Daily complement to cost-report. Pass var to override the cap.
  fork-fleet: { enabled: false, schedule: "0 10 * * 1" }
  fork-cohort: { enabled: false, schedule: "0 19 * * 0", model: "claude-sonnet-4-6" } # Sunday 19:00 UTC — bucket every fork by activation stage (COLD/STALE/ACTIVE/POWER) using GitHub Actions run history; week-over-week deltas in memory/topics/fork-cohort-state.json; gated notify (skip on STEADY + no transitions). Read-only across the fleet.
  skill-evals: { enabled: false, schedule: "0 6 * * 0", model: "claude-sonnet-4-6" }
  skill-update-check: { enabled: false, schedule: "0 19 * * 0", model: "claude-sonnet-4-6", var: "" } # Sunday 19:00 UTC — audit imported skills (skills.lock) for upstream changes; CRITICAL/HIGH/MEDIUM/LOW priority triage with enabled-state cross-reference; ACCEPT mode (var=accept:{skill_name}) for explicit lock advancement
  v4-readiness: { enabled: false, schedule: "workflow_dispatch", model: "claude-sonnet-4-6", var: "" } # one-shot — per-fork v4 upgrade readiness checklist. Reads aeon.yml + skills.json + MEMORY.md against an embedded v4 change manifest; emits Safe / Review / Custom / Action breakdown. Pass dry-run to skip notify, or owner/repo to audit a fork remotely.
  spawn-instance: { enabled: false, schedule: "workflow_dispatch", var: "" }
  fleet-control: { enabled: false, schedule: "0 9,15 * * *" }
  weekly-review: { enabled: false, schedule: "0 19 * * 1" }
  operator-scorecard: { enabled: true, schedule: "30 10 * * 1", model: "claude-sonnet-4-6", var: "" }
  repo-scanner: { enabled: false, schedule: "0 15 * * 0", model: "claude-sonnet-4-6", var: "" }
  workflow-security-audit: { enabled: false, schedule: "0 16 * * 0" }
  security: { enabled: false, schedule: "0 16 * * *" }
  webhook-bridge: { enabled: false, schedule: "workflow_dispatch", var: "" } # external-event-to-skill bridge; the real wiring lives in .github/workflows/webhook.yml — operators don't dispatch this skill, they POST repository_dispatch with event_type=aeon-skill

  # --- Upstream sync (2026-05-14) ---
  ai-framework-watch: { enabled: false, schedule: "30 8 * * 1", model: "claude-sonnet-4-6", var: "" } # Monday 08:30 UTC — weekly competitive-intelligence digest across 9 AI agent frameworks (anchor + 8 peers). Momentum signals, 7d/30d star deltas, release listings, breaking-change flags. Set var to a watchlist slug (e.g. langgraph) for a single-framework deep dive.
  aixbt-pulse: { enabled: false, schedule: "0 9,21 * * *", model: "claude-sonnet-4-6" } # twice daily — cross-domain market pulse from AIXBT's free grounding endpoint
  competitor-launch-radar: { enabled: false, schedule: "0 10 * * 1", model: "claude-sonnet-4-6", var: "" } # Monday 10:00 UTC — weekly scan of Product Hunt RSS + HN Algolia for NEW AI-agent-framework launches outside the 9-framework cohort tracked by ai-framework-watch. Classifies framework/mcp/product, noise floor 10 upvotes/points, LRU-200 dedup, gated notify (QUIET on zero entrants). Pass dry-run to skip notify (state + article still write).
  ecosystem-pulse: { enabled: false, schedule: "0 11 * * 1", model: "claude-sonnet-4-6", var: "" } # Monday 11:00 UTC — weekly liveness check of ECOSYSTEM.md projects: resolves each to a GitHub repo (operator map memory/topics/ecosystem-pulse-map.json or strict search), buckets by last-push recency (ACTIVE/RECENT/COLD/X-only), surfaces 7d releases + WoW bucket transitions + star deltas. Gated notify (QUIET once baseline set + nothing moved). Pass dry-run to skip notify. Backport of upstream aeon PR #227; ships with ECOSYSTEM.md.
  config-validator: { enabled: false, schedule: "workflow_dispatch", model: "claude-sonnet-4-6" } # workflow_dispatch only — structural validator for aeon.yml + .github/workflows/aeon.yml: checkout-before-Run ordering, duplicate skill keys, enabled skills missing SKILL.md. CLEAN runs are silent; only ISSUES notify. Run before pushing aeon.yml changes. Backport of upstream aeon PR #219 (checkout check adapted to aeon-agent's conditional-checkout workflow).
  contributor-reward: { enabled: false, schedule: "30 9 * * 1", model: "claude-sonnet-4-6", var: "" } # Monday — turn Sunday's leaderboard into a tier-priced rewards plan in memory/distributions.yml; pass dry-run to preview
  contributor-spotlight: { enabled: false, schedule: "0 20 * * 0", model: "claude-sonnet-4-6", var: "" } # Sunday 20:00 UTC — weekly recognition post: pick one POWER fork from the latest fork-cohort run and convert it into a named human moment (operator handle, enabled stack, diverged work, 30d commits). 4-week dedup. Pass dry-run to skip notify, or owner/repo to override the auto-pick.
  create-campaign: { enabled: false, schedule: "workflow_dispatch", var: "" } # one-shot — provision Meta campaigns and ad sets on AdManage.ai from declarative config. Entities created PAUSED.
  fleet-skill-adoption: { enabled: false, schedule: "0 22 * * 0", model: "claude-sonnet-4-6", var: "" } # Sunday 22:00 UTC — weekly fleet skill-adoption leaderboard: reads each POWER+ACTIVE fork's aeon.yml, counts per-slug enabled:true, ranks top-15/bottom-15 by fleet penetration. Demand-side complement to fork-skill-gap (measures enabled, not present). Reads fork-cohort cache when fresh (≤8d) or live-fallback. Gated notify (QUIET when top-10 unchanged + no ≥5pt moves). Pass dry-run to skip notify, or owner/repo to override parent. Backport of upstream aeon PR #245.
  sparkleware-catalog: { enabled: false, schedule: "0 9 * * 2", model: "claude-sonnet-4-6", var: "" } # Tuesday 09:00 UTC — weekly enriched export of skill-packs.json: joins the curated registry to live GitHub signals (stars, last-push, live skills-pack.json manifest count) and writes machine-readable skill-packs-catalog.json (repo root) for external tools like Sparkleware (Issue #244). Read-only against skill-packs.json. Gated notify (only registry composition / reachability changes; star+drift refresh silently). Pass dry-run to skip notify. Backport of upstream aeon PR #252.
  fleet-state: { enabled: false, schedule: "0 8 * * 1", model: "claude-sonnet-4-6", var: "" } # Monday 08:00 UTC — weekly synthesis of fork-cohort + fork-release-tracker + contributor-spotlight into one fleet-state digest with WoW deltas + 12-week trend. Quiet weeks suppress notify. Pass dry-run to skip notify, or owner/repo to override parent.
  follow-up-patrol: { enabled: false, schedule: "0 11 * * 2", model: "claude-sonnet-4-6", var: "" } # Tuesday 11:00 UTC — weekly escalation audit: parses memory/MEMORY.md follow-up section + memory/issues/INDEX.md, computes per-item ages, tiers CRITICAL (>21d operator) / HIGH (>14d operator) / MEDIUM (>7d) / WATCH (≤7d or auto-tracked). Notifies only when CRITICAL or HIGH non-zero. Catch-all complement to pr-tracker / disclosure-tracker. Pass var to filter (e.g. "security"). Backport of upstream aeon PR #272.
  fork-contributor-leaderboard: { enabled: false, schedule: "30 17 * * 0", model: "claude-sonnet-4-6" } # Sunday — rank community contributors across forks and upstream PRs
  fork-first-run-alert: { enabled: false, schedule: "30 20 * * *", model: "claude-sonnet-4-6", var: "" } # daily 20:30 UTC — named same-day alert the first time a fork completes a workflow run. Reads fork-cohort cache when fresh (≤8d), live-fallback otherwise. Persistent seen-list (LRU 500), bot allowlist suppressed from alerts. Per-fork alert when 1–3 new activators; batch notification at 4+ to avoid spam. Pass dry-run to skip notify, or owner/repo to override parent.
  fork-health-score: { enabled: false, schedule: "45 10 * * 1", model: "claude-sonnet-4-6", var: "" } # Monday 10:45 UTC — weekly per-fork health tier (ACTIVE/WARM/STALE/QUIET) from push recency + enabled skill count + 30d PR throughput. Top-10 ACTIVE leaderboard + fleet ACTIVE ratio; reuses fork-cohort state when fresh. Gated notify (QUIET when ratio steady and no top-10 churn / ≥3 tier transitions). Pass dry-run to skip notify, or owner/repo to override parent. Backport of upstream aeon PR #271.
  fork-release-tracker: { enabled: false, schedule: "30 19 * * 0", model: "claude-sonnet-4-6", var: "" } # Sunday 19:30 UTC — weekly scan: celebrate when any fork cuts a tagged GitHub release in the last 7 days. Silent on quiet weeks. Pass dry-run to skip notify, or owner/repo to override parent.
  fork-skill-digest: { enabled: false, schedule: "30 18 * * 0", model: "claude-sonnet-4-6" } # Sunday — divergence digest: where the configured fleet disagrees with upstream defaults
  fork-skill-gap: { enabled: false, schedule: "0 21 * * 0", model: "claude-sonnet-4-6", var: "" } # Sunday 21:00 UTC — weekly per-fork upstream-skill-adoption gap report. Reads fork-cohort cache when fresh (≤8d) or live-fallback via gh api repos/{parent}/forks. Compares fork skills.json vs upstream skills.json on slug presence. Pass dry-run to skip notify, or owner/repo to override parent.
  huggingface-trending: { enabled: false, schedule: "30 9 * * *", model: "claude-sonnet-4-6", var: "" } # daily — curated trending HF models/datasets/spaces with "why notable" lines, momentum tags, and bucket clustering. Set var to one of {models, datasets, spaces} to scope.
  mcp-pulse: { enabled: false, schedule: "0 10 * * 5", model: "claude-sonnet-4-6" } # Friday 10:00 UTC — weekly tracker for the Model Context Protocol ecosystem: new server implementations, adoption velocity (npm + GitHub), notable integrations, protocol evolution. Reads memory/topics/mcp-ecosystem.md as the rolling baseline; momentum-scored signal log + thesis check. gh api + WebFetch fallback for npm/PyPI; ${today_minus_7} cutoff (no $(date) per runner hook). Notify gated on momentum>0 or new repos or new news. Backport of upstream aeon PR #272 (the same general-ops batch as spend-monitor / follow-up-patrol / narrative-convergence).
  monitor-kalshi: { enabled: false, schedule: "0 13 * * *", model: "claude-sonnet-4-6" } # monitor Kalshi prediction markets for 24h price moves and volume
  narrative-convergence: { enabled: false, schedule: "0 13 * * *", model: "claude-sonnet-4-6", var: "" } # daily 13:00 UTC — cross-skill convergence detector: entities/themes surfaced by 3+ independent skill categories in 48h = high-confidence write opportunities. Category map in memory/topics/signal-categories.md (operator-editable, seeded on first run). Falls back to memory logs when .outputs/ is sparse — the primary path on aeon-agent until chains are configured. Pass var to filter by entity/theme. Backport of upstream aeon PR #272.
  onboard: { enabled: false, schedule: "workflow_dispatch", var: "" } # one-shot setup validator — checks secrets/workflows/memory writability and notifies a checklist with fix commands; pair with ./onboard CLI
  pr-merge-queue: { enabled: false, schedule: "45 9 * * *", model: "claude-sonnet-4-6", var: "" } # daily 09:45 UTC — operator-facing digest of every open PR on aaronjmars/aeon-agent. Buckets each by touched-file risk tier (CORE_REVIEW > INFRA_REVIEW > SKILL_WARN_OR_BLOCK > SKILL_PASS > FAST_TRACK > UNKNOWN), runs skill-security-scan on every changed SKILL.md, sorts each bucket by age. Trusted-author PRs route to auto-merge. Gated notify (baseline run, new non-FAST_TRACK PR, CORE_REVIEW/SKILL_BLOCK with fresh head SHA, worsening bucket transition). Pass dry-run to skip notify, or owner/repo to override the target. Backport of upstream aeon PR #318.
  pr-triage: { enabled: false, schedule: "30 9 * * *", var: "" } # first-touch external-PR triage (verdict + label + welcoming comment); var: owner/repo or owner/repo#N for one-shot
  price-threshold-alert: { enabled: false, schedule: "*/30 * * * *", model: "claude-sonnet-4-6", var: "" } # every 30 minutes — fire on tracked-token ATH, ±20% 1h move, or operator-set target crossing (var=target_price,target_price2,...). Silent on normal runs. Set var=dry-run to skip notify.
  schedule-ads: { enabled: false, schedule: "0 8 * * *" } # daily — schedule paid ads across Meta/TikTok/Snapchat/Pinterest/LinkedIn via AdManage.ai. Launches PAUSED by default.
  show-hn-draft: { enabled: false, schedule: "workflow_dispatch", var: "" } # one-shot — draft Show HN post + r/MachineLearning + r/selfhosted variants from live repo state, ready for the operator to paste at launch time. Set var to one of {show-hn, r/MachineLearning, r/selfhosted} to regenerate that single variant.
  product-hunt-launch: { enabled: false, schedule: "workflow_dispatch", var: "" } # one-shot — draft the full Product Hunt launch asset pack (tagline 60ch / description 260ch / first comment 500ch / maker comment 500ch / six 80ch feature bullets) from live repo state. Set var to one of {tagline, description, first-comment, maker-comment, bullets} to regenerate that single section only.
  skill-analytics: { enabled: false, schedule: "30 18 * * 3", model: "claude-sonnet-4-6" } # Wednesday — fleet-level skill-run analytics: ranked run counts, exit-taxonomy distribution, anomaly flags (significance-gated)
  skill-enabler: { enabled: false, schedule: "workflow_dispatch", var: "" } # workflow_dispatch only — set var to a comma-separated list of skill slugs (e.g. "star-milestone,thread-formatter") to flip enabled:false → enabled:true for each in aeon.yml, validate, commit, and open a PR with per-skill rationale. Empty var is a no-op. Prefix var with "dry-run:" to validate without writing.
  skill-graph: { enabled: false, schedule: "0 17 * * 0" } # Sunday — regenerate skill dependency map
  smithery-manifest: { enabled: false, schedule: "0 6 1/7 * *", model: "claude-sonnet-4-6" } # weekly — refresh docs/smithery-manifest.json + smithery.yaml + smithery-submission.md from skills.json + aeon-mcp; PR + notify only on diff
  star-milestone: { enabled: true, schedule: "15 15 * * *" } # daily — announce when watched repos cross star-count milestones
  star-momentum-alert: { enabled: true, schedule: "10 10 * * *", model: "claude-sonnet-4-6", var: "" } # daily — project next milestone crossing date from 14-day repo-pulse history; alert only when projected date lands in 7-14d window on Tue/Wed/Thu (Show HN dispatch slot)
  syndicate-article: { enabled: false, schedule: "30 15 * * *", model: "claude-sonnet-4-6", var: "" } # cross-post latest article to Dev.to
  upstream-gap: { enabled: false, schedule: "0 12 * * 1", model: "claude-sonnet-4-6", var: "" } # Monday 12:00 UTC — weekly diff of local skills/ against upstream aaronjmars/aeon. Sorted queue of pending backports by upstream merge date with Urgent (≥7d) / Stale (2–6d) / Fresh (<2d) tiers. Gated notify (silent on CLEAR + nothing-resolved, and on FRESH_ONLY with no new STALE transitions). Pass dry-run to skip notify, or owner/repo to override the parent. Pairs with the 17-day same-day-after backport chain by making the gap explicit.

